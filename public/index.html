<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>StudyFeed</title>
<style>
:root{--bg:#f0f2f5;--c:#fff;--t:#1c1e21;--m:#65676b;--a:#4f46e5;--l:#e4e6eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t);background:var(--bg)}
header{position:sticky;top:0;z-index:8;background:var(--c);border-bottom:1px solid var(--l);padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-size:23px;font-weight:800;color:var(--a);flex:1}header input{flex:2;margin:0;border-radius:99px;background:var(--bg);border:0;padding:9px 14px}
main{max-width:600px;margin:0 auto;padding:10px 10px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;z-index:9;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--m);font:600 10px inherit;display:flex;flex-direction:column;align-items:center;padding:4px 0;cursor:pointer}nav b{font-size:22px}nav .on{color:var(--a)}
@media(min-width:800px){nav{top:52px;right:auto;width:84px;flex-direction:column;justify-content:flex-start;gap:8px;padding:16px 4px;border-right:1px solid var(--l);border-top:0}main{margin-left:calc(50% - 300px + 42px)}}
.stories{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;text-align:center;font-size:11px;font-weight:600;width:64px;cursor:pointer;color:var(--m)}.st i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 4px;border-radius:50%;font-style:normal;font-size:26px;background:var(--c);border:3px solid transparent;background-clip:padding-box;outline:3px solid var(--c);box-shadow:0 0 0 3px var(--c1)}
.st.on{color:var(--t)}
.card{background:var(--c);border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}.hd div{flex:1;line-height:1.2}.hd small{display:block}
.av{width:40px;height:40px;border-radius:50%;background:var(--c1,var(--a));color:#fff;display:grid;place-items:center;font:700 17px inherit;font-style:normal}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--m)}
.tx{margin:4px 0 8px;white-space:pre-wrap;word-break:break-word;font-size:16px}
.paper{margin:6px 0 10px;padding:14px 18px;background:#fff;color:#111;border:1px solid #cfcfcf;border-radius:2px;font:16px/1.55 'Times New Roman',Georgia,serif;box-shadow:0 2px 8px #0003}
.paper .ph{display:flex;justify-content:space-between;font:700 11px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px}
.paper .qn{font-weight:700;text-transform:uppercase;margin:0 0 6px}.paper .mk{float:right}.paper .tx{margin:6px 0;font-size:16px}
.paper .info{border:1px solid #111;padding:8px 10px;margin:8px 0;font-size:15px}.paper .info b{display:block;font-size:12px;margin-bottom:4px}
.paper table{border-collapse:collapse;width:100%}.paper td,.paper th{border:1px solid #111;padding:3px 6px;text-align:left}.paper .ln{border-bottom:1px solid #111;height:26px}
.bar{height:12px;background:var(--l);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--a);transition:width .4s}
.act{display:flex;border-top:1px solid var(--l);margin-top:10px;padding-top:4px}.act button{flex:1;padding:8px 2px;border:0;background:none;color:var(--m);font:600 13px inherit;cursor:pointer;border-radius:8px}.act button:active{background:var(--bg)}.act .lk{color:#e0245e}
.ans{background:#fffbe6;border:1px solid #f1e3a1;padding:10px 12px;border-radius:10px;margin-top:8px;word-break:break-word}.cm{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:6px}
small,.mu{color:var(--m)}.mu{text-align:center}
input,select,textarea{width:100%;padding:11px 14px;margin:5px 0;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--t);font:inherit;outline:0}input:focus,textarea:focus{border-color:var(--a)}
.p{width:100%;padding:11px;margin:6px 0;border:0;border-radius:10px;background:var(--a);color:#fff;font:700 15px inherit;cursor:pointer}.g{background:var(--bg);color:var(--t)}
.row{display:flex;gap:8px}.row>*{flex:1}.pw{position:relative}.pw button{position:absolute;right:6px;top:9px;background:none;border:0;font-size:18px}
.cmp{display:flex;gap:10px;align-items:center;cursor:pointer}.cmp span{flex:1;background:var(--bg);padding:10px 14px;border-radius:99px;color:var(--m)}
.vp{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:6px 0}.vp iframe,.vp video{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;z-index:2;display:grid;place-items:center;cursor:pointer}.ov span{width:56px;height:56px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:22px}.vp.pl .ov span{opacity:0}
.mt{position:absolute;z-index:3;right:8px;bottom:10px;background:#000a;color:#fff;border:0;border-radius:99px;padding:4px 9px}.pgb{position:absolute;z-index:3;left:0;right:0;bottom:0;height:4px;background:#fff4}.pgb i{display:block;height:100%;width:0;background:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
header button{background:none;border:0;font-size:22px;cursor:pointer}.ans{color:#3a2f00}
body[data-t=dark]{--bg:#0f1117;--c:#1a1d27;--t:#e8eaf2;--m:#9aa1b5;--l:#2a2e3b;--a:#8b8cff}
body[data-t=glow]{--bg:#05010f;--c:#0e0720;--t:#f3eaff;--m:#b69de0;--l:#3a1d6e;--a:#d946ef}
body[data-t=ocean]{--bg:#e6f4fb;--t:#0b2a3c;--m:#4f7184;--l:#cfe6f2;--a:#0284c7}
body[data-t=sunset]{--bg:#fff1e8;--t:#3b1d12;--m:#8a5a47;--l:#f7d9c7;--a:#ea580c}
body[data-t=glow] .card,body[data-t=glow] header,body[data-t=glow] nav{border:1px solid #d946ef88;box-shadow:0 0 14px #d946ef55}
body[data-t=glow] .logo{text-shadow:0 0 14px #d946ef}body[data-t=glow] .p{box-shadow:0 0 16px #d946ef99}body[data-t=glow] .av{box-shadow:0 0 10px var(--c1,#d946ef)}
</style></head><body>
<header><div class=logo>StudyFeed</div><button onclick=cyc()>🎨</button><input id=sq placeholder="🔍 Search" oninput="q=this.value;clearTimeout(window.sT);window.sT=setTimeout(()=>{tab='feed';nav();render()},300)"></header>
<main id="m"></main><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>$d.querySelector(s),$d=document,uid=localStorage.uid||(localStorage.uid=Math.random().toString(36).slice(2));
const H=()=>({'Content-Type':'application/json','x-admin':localStorage.adm||''});
const api=async(u,o={})=>{try{const r=await fetch(u,{headers:H(),...o,body:o.body&&JSON.stringify(o.body)}),t=await r.text();try{return JSON.parse(t)}catch{return{error:r.status==401?'Wrong admin password':t||'Error'}}}catch{return{error:'Network error'}}};
const SM={Mathematics:['📐','#4f46e5'],English:['📖','#ec4899'],Physics:['⚡','#f59e0b'],Chemistry:['🧪','#10b981'],Biology:['🧬','#14b8a6'],History:['🏛️','#d97706'],Geography:['🌍','#0ea5e9'],ICT:['💻','#8b5cf6']},SUBS=Object.keys(SM),DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'now':m<60?~~m+'m':m<1440?~~(m/60)+'h':~~(m/1440)+'d'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)};
const tabs=[['feed','🏠','Home'],['tt','🗓️','Timetable'],['post','➕','Post'],['notes','🔔','Alerts'],['set','⚙️','Settings']];
let tab='feed',q='',sub='';
function nav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}
function go(t,s){tab=t;sub=s??sub;if(t!='feed')sub='';nav();render();scrollTo(0,0)}
async function render(){const m=$('#m');
 if(tab=='feed'){let p=await api('/api/feed?uid='+uid);if(!Array.isArray(p))p=[];if(sub)p=p.filter(x=>x.subject==sub);if(q)p=p.filter(x=>(x.text+x.subject).toLowerCase().includes(q.toLowerCase()));
  m.innerHTML=`<div class=stories><div class="st ${sub?'':'on'}" onclick="sub='';render()" style="--c1:#4f46e5"><i>🏠</i>All</div>${SUBS.map(s=>`<div class="st ${sub==s?'on':''}" onclick="sub='${s}';render()" style="--c1:${SM[s][1]}"><i>${SM[s][0]}</i>${s.slice(0,8)}</div>`).join('')}</div><div class="card cmp" onclick="go('post')"><i class=av>${esc((localStorage.name||'Y')[0].toUpperCase())}</i><span>Ask a question or share a video…</span></div>`+(p.map(card).join('')||'<div class="card mu">Nothing here yet 📚</div>');initV();api('/api/seen',{method:'POST',body:{uid,ids:p.slice(0,10).map(x=>x.id)}})}
 else if(tab=='tt')ttView()
 else if(tab=='post')m.innerHTML=`<div class=card><b>New post</b><input id=pn placeholder="Your name" value="${esc(localStorage.name)}"><div class=row><select id=pt><option value=question>Question</option><option value=video>Video</option>${localStorage.adm?'<option value=quiz>Quiz</option>':''}</select><select id=ps>${SUBS.map(s=>`<option>${s}</option>`).join('')}</select></div><textarea id=px rows=4 placeholder="What's on your mind?"></textarea><input id=pv placeholder="Video link (YouTube or .mp4)">${localStorage.adm?'<input id=pa placeholder="Answer (quizzes)">':''}<button class=p onclick=doPost()>Post</button><small>Student posts are reviewed first.</small></div>`;
 else if(tab=='notes'){const n=await api('/api/notes/'+uid);m.innerHTML=((Array.isArray(n)&&n.length)?n.map(x=>`<div class=card>${esc(x.text)}<small> · ${ago(x.ts)}</small></div>`).join(''):'<div class="card mu">No alerts yet.</div>')+(localStorage.adm?'<h3>Pending approval</h3><div id=pend></div>':'');if(localStorage.adm)pend()}
 else settings()}
function vid(u){u=u||'';const y=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(y)return`<div class=vp data-y="${y[1]}"><div class=ov><span>▶</span></div><button class=mt>🔊</button><div class=pgb><i></i></div></div>`;if(/^https?:\/\/.+\.(mp4|webm)(\?|$)/i.test(u))return`<div class=vp><video controls playsinline src="${esc(u)}"></video></div>`;return''}
let YTr;const ytLoad=()=>window.YT&&YT.Player?Promise.resolve():YTr||(YTr=new Promise(r=>{window.onYouTubeIframeAPIReady=r;const s=$d.createElement('script');s.src='https://www.youtube.com/iframe_api';$d.head.appendChild(s)}));
async function initV(){const els=$d.querySelectorAll('.vp[data-y]:not(.ok)');if(!els.length)return;await ytLoad();els.forEach(el=>{el.classList.add('ok');const d=$d.createElement('div');el.prepend(d);const pl=new YT.Player(d,{host:'https://www.youtube-nocookie.com',videoId:el.dataset.y,playerVars:{controls:0,rel:0,modestbranding:1,playsinline:1,fs:0,disablekb:1,iv_load_policy:3},events:{onStateChange:e=>el.classList.toggle('pl',e.data==1)}});el.querySelector('.ov').onclick=()=>pl.getPlayerState()==1?pl.pauseVideo():pl.playVideo();el.querySelector('.mt').onclick=e=>{pl.isMuted()?(pl.unMute(),e.target.textContent='🔊'):(pl.mute(),e.target.textContent='🔇')};setInterval(()=>{try{el.querySelector('.pgb i').style.width=pl.getCurrentTime()/pl.getDuration()*100+'%'}catch{}},500)})}
function card(p){const m=SM[p.subject]||['📘','#4f46e5'],qz=p.type=='quiz'||p.type=='question';return`<article class=card style="--c1:${m[1]}"><div class=hd><i class=av>${esc((p.author||'?')[0].toUpperCase())}</i><div><b>${esc(p.author)}</b><small>${ago(p.ts)} · ${m[0]} ${esc(p.subject)}</small></div><span class=chip>${p.type=='quiz'?'Quiz':p.type=='video'?'Video':'Question'}</span></div>${qz?`${paper(p)}`:`<p class=tx>${esc(p.text)}</p>`}${vid(p.video)}<div class=act><button class="${p.liked?'lk':''}" onclick="like('${p.id}',this)">${p.liked?'❤️':'🤍'} ${p.nl||''}</button><button onclick="cm('${p.id}')">💬 ${p.nc||''}</button>${p.hasAnswer?`<button onclick="ans('${p.id}',this)">💡 Answer</button>`:''}<button onclick="expl('${p.id}',this)">✨ Explain</button><button onclick="share('${p.id}')">↗️</button></div><div id="x${p.id}"></div></article>`}
async function like(i,b){const r=await api(`/api/posts/${i}/like`,{method:'POST',body:{uid}});if(r.error)return;b.className=r.liked?'lk':'';b.textContent=(r.liked?'❤️ ':'🤍 ')+(r.n||'')}
function share(i){const t='Check this on StudyFeed: '+location.origin;navigator.share?navigator.share({text:t,url:location.origin}).catch(()=>{}):(navigator.clipboard?.writeText(location.origin),toast('Link copied'))}
async function ans(i,b){const r=await api(`/api/posts/${i}/answer`);const a=$('#a'+i)||$('#x'+i);a.innerHTML+=`<div class=ans>💡 ${esc(r.answer)}</div>`;b.remove()}
async function expl(i,b){const t=b.closest('.card').querySelector('.tx').textContent;$('#x'+i).innerHTML='<div class="ans mu">✨ Thinking…</div>';const r=await api('/api/explain',{method:'POST',body:{text:t}});$('#x'+i).innerHTML=`<div class=ans>${esc(r.text||r.error)}</div>`}
async function cm(i){const c=await api(`/api/posts/${i}/comments`);$('#x'+i).innerHTML=(Array.isArray(c)?c:[]).map(x=>`<div class=cm><b>${esc(x.name)}</b> ${esc(x.text)}</div>`).join('')+`<div class=row style="margin-top:6px"><input id=ct${i} placeholder="Write a comment…"><button class=p style="flex:0 0 76px" onclick="addC('${i}')">Send</button></div>`}
async function addC(i){await api(`/api/posts/${i}/comments`,{method:'POST',body:{name:localStorage.name,text:$('#ct'+i).value}});cm(i)}
function saveTT(d,v){const t=JSON.parse(localStorage.tt||'{}');t[d]=v;localStorage.tt=JSON.stringify(t);toast('Saved')}
async function doPost(){localStorage.name=$('#pn').value;const r=await api('/api/posts',{method:'POST',body:{uid,name:$('#pn').value,type:$('#pt').value,subject:$('#ps').value,text:$('#px').value,video:$('#pv').value,answer:$('#pa')?.value}});if(r.error)return toast(r.error);toast(r.pending?'Sent for approval ✅':'Posted ✅');go('feed')}
async function pend(){const p=await api('/api/pending');$('#pend').innerHTML=Array.isArray(p)?p.map(x=>`<div class=card>${esc(x.text)}<small> · ${esc(x.author)} · ${esc(x.subject)}</small><div class=row><button class=p onclick="rev('${x.id}',1)">Approve</button><button class="p g" onclick="rev('${x.id}',0)">Deny</button></div></div>`).join('')||'<div class="card mu">Nothing waiting.</div>':'<div class="card mu">Wrong admin password</div>'}
async function rev(i,ok){await api('/api/review/'+i,{method:'POST',body:{ok}});toast(ok?'Approved':'Denied');render()}
async function settings(){const adm=localStorage.adm||'',s=adm?await api('/api/settings'):{},ok=s.base!==undefined;
 $('#m').innerHTML=`<div class=card><b>🔐 Admin access</b><div class=pw><input id=ad type=password placeholder="Enter admin password" value="${esc(adm)}" autocomplete=off><button onclick="const i=$('#ad');i.type=i.type=='password'?'text':'password'">👁</button></div><div class=row><button class=p onclick="localStorage.adm=$('#ad').value;settings()">Unlock</button>${adm?'<button class="p g" onclick="localStorage.removeItem(\'adm\');settings()">Lock</button>':''}</div><small>${ok?'✅ Unlocked':adm?'❌ '+esc(s.error||'Wrong password'):'🔒 Locked'}</small></div>`+(ok?`<div class=card><b>🤖 AI connection</b><br><small>RelayAPI or any OpenAI-style API. Set AI_API_KEY in Render to keep it forever.</small><input id=sb placeholder="Base URL (ends with /v1)" value="${esc(s.base)}"><small>${s.key?'✅ Key saved '+esc(s.key):'⚠️ No key saved yet'}</small><input id=sk type=password placeholder="Paste a new key to change it"><input id=sm placeholder="Model" value="${esc(s.model)}"><div class=row><button class=p onclick=saveS()>Save</button><button class="p g" onclick=testS()>Test</button></div><button class="p g" onclick=genS()>⚡ Generate today's quizzes</button><small id=so></small></div>`+adminCards(s):'')+themeCard();if(ok){loadSch();vstat();jpoll()}}
async function saveS(){const r=await api('/api/settings',{method:'POST',body:{base:$('#sb').value,key:$('#sk').value,model:$('#sm').value}});$('#so').textContent=r.error?'❌ '+r.error:'Saved ✅'}
async function testS(){$('#so').textContent='Testing…';const r=await api('/api/test',{method:'POST'});$('#so').textContent=r.ok?'Works ✅ '+r.reply:'❌ '+(r.error||'Failed')}
async function genS(){const r=await api('/api/generate',{method:'POST'});$('#so').textContent=r.error?'❌ '+r.error:'Started, watch the bar at the top of Admin ⬆️';if(!r.error)jpoll()}
const TH=['light','dark','glow','ocean','sunset'],theme=t=>{document.body.dataset.t=t;localStorage.th=t},cyc=()=>{theme(TH[(TH.indexOf(localStorage.th||'light')+1)%5]);toast('Theme: '+localStorage.th)};
const val=i=>$('#'+i).value,so=a=>(a?'<option>All</option>':'')+SUBS.map(s=>`<option>${s}</option>`).join('');
const themeCard=()=>`<div class=card><b>🎨 Theme</b><div class=row style="flex-wrap:wrap">${TH.map(t=>`<button class="p g" onclick="theme('${t}')">${t}</button>`).join('')}</div></div>`;
const adminCards=s=>`<div class=card id=jc style="display:none"><b id=jl></b><div class=bar><i id=jf></i></div><small id=jt></small></div><div class=card><b>🧠 Tell the AI what to post</b><textarea id=ap rows=3 placeholder="e.g. A scenario question on photosynthesis for a farmer growing beans"></textarea><div class=row><select id=as>${so()}</select><input id=ac type=number min=1 max=10 value=1></div><button class=p onclick=aiNow()>Create now</button><small id=ao></small></div>
<div class=card><b>⏰ Auto-post schedule</b><div class=row><select id=st_><option value=quiz>Questions</option><option value=video>YouTube video</option></select><select id=ss>${so(1)}</select></div><div class=row><input id=se type=number min=1 value=60 placeholder="every N min"><input id=sc type=number min=1 max=5 value=1 placeholder="how many"></div><input id=sp placeholder="Topic / extra instruction (optional)"><button class=p onclick=addSch()>Add schedule</button><div id=sl></div></div>
<div class=card><b>📺 Add a lesson video</b><input id=vq placeholder="Search e.g. photosynthesis S3 lesson"><select id=vs>${so()}</select><button class=p onclick=addVid()>Find &amp; post</button><small id=vo></small></div>
<div class=card><b>🎓 Question style</b><textarea id=sy rows=3>${esc(s.style||'Scenario-based, competency-based questions matching the new competency-based lower secondary curriculum: a short real-life scenario, then a question that applies knowledge.')}</textarea><button class=p onclick=saveStyle()>Save style</button></div>
<div class=card><b>☁️ Vault &amp; backup</b><br><small id=vst></small><button class="p g" onclick=vsave()>Save to vault now</button><div class=row><button class="p g" onclick=bk()>Download</button><button class="p g" onclick="$('#rf').click()">Restore</button></div><input id=rf type=file hidden onchange="rs(this.files[0])"></div>`;
async function aiNow(){const r=await api('/api/ai-post',{method:'POST',body:{subject:val('as'),count:val('ac'),prompt:val('ap')}});$('#ao').textContent=r.error?'❌ '+r.error:'Started, watch the bar above ⬆️';if(!r.error)jpoll()}
async function addVid(){$('#vo').textContent='Searching…';const r=await api('/api/video',{method:'POST',body:{subject:val('vs'),query:val('vq')}});$('#vo').textContent=r.error?'❌ '+r.error:'✅ Video added'}
async function addSch(){const r=await api('/api/schedules',{method:'POST',body:{type:val('st_'),subject:val('ss'),every:val('se'),count:val('sc'),prompt:val('sp')}});r.error?toast(r.error):(toast('Scheduled ✅'),loadSch())}
async function loadSch(){const l=await api('/api/schedules');$('#sl').innerHTML=Array.isArray(l)?l.map(x=>`<div class=cm>${x.type=='video'?'📺':'📝'} ${esc(x.subject)} · every ${x.every}m · ${x.count}×${x.prompt?' · '+esc(x.prompt.slice(0,40)):''} <b onclick="delSch('${x.id}')" style="cursor:pointer">✕</b>${x.err?'<br><small>⚠️ '+esc(x.err)+'</small>':''}</div>`).join('')||'<small>No schedules yet.</small>':''}
async function delSch(i){await api('/api/schedules/'+i,{method:'DELETE'});loadSch()}
async function saveStyle(){await api('/api/settings',{method:'POST',body:{style:val('sy')}});toast('Saved ✅')}
async function vstat(){const s=await api('/api/storage');$('#vst').innerHTML=s.error?'':!s.configured?'Not connected. Add VAULT_KEY in Render.':s.ok?'✅ Saved in vault '+ago(s.last)+' ago':'❌ '+esc(s.err)}
async function vsave(){$('#vst').textContent='Saving…';await api('/api/storage/save',{method:'POST'});vstat()}
async function bk(){const d=await api('/api/backup'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)]));a.download='studyfeed-backup.json';a.click()}
async function rs(f){const r=await api('/api/restore',{method:'POST',body:JSON.parse(await f.text())});toast(r.error||'Restored ✅')}
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],TT=()=>JSON.parse(localStorage.tt2||'[]'),TS=a=>localStorage.tt2=JSON.stringify(a),pad=n=>String(n).padStart(2,'0'),ft=(h,m)=>`${h%12||12}:${pad(m)} ${h<12?'AM':'PM'}`,DO=[1,2,3,4,5,6,0];
function ttView(){const a=TT().sort((x,y)=>x.h*60+x.m-y.h*60-y.m),td=new Date().getDay();
 $('#m').innerHTML=`<div class=card><b>➕ Add to timetable</b><select id=td>${DO.map(d=>`<option value=${d} ${d==td?'selected':''}>${DN[d]}</option>`).join('')}</select><select id=ts>${so()}</select><div class=row><select id=th>${[...Array(24).keys()].map(h=>`<option value=${h} ${h==8?'selected':''}>${h%12||12} ${h<12?'AM':'PM'}</option>`).join('')}</select><select id=tm>${[0,5,10,15,20,25,30,35,40,45,50,55].map(m=>`<option value=${m}>:${pad(m)}</option>`).join('')}</select></div><button class=p onclick=ttAdd()>Add &amp; set alarm ⏰</button><small>Alarms ring while StudyFeed is open in your browser. Allow notifications when asked.</small></div>`+DO.map(d=>{const l=a.filter(x=>x.d==d);return l.length?`<div class=card><b>${DN[d]}${d==td?' · Today':''}</b>${l.map(x=>`<div class=cm style="display:flex;gap:10px;align-items:center"><span style="flex:1">${SM[x.s]?.[0]||'📘'} ${esc(x.s)} · <b>${ft(x.h,x.m)}</b></span><span onclick="ttAl('${x.id}')" style="cursor:pointer">${x.a?'🔔':'🔕'}</span><b onclick="ttDel('${x.id}')" style="cursor:pointer">✕</b></div>`).join('')}</div>`:''}).join('')}
function ttAdd(){const a=TT();a.push({id:Date.now().toString(36),d:+val('td'),s:val('ts'),h:+val('th'),m:+val('tm'),a:true});TS(a);try{Notification.requestPermission()}catch{}toast('Added ⏰');ttView()}
function ttAl(i){const a=TT(),x=a.find(y=>y.id==i);x.a=!x.a;TS(a);ttView()}
function ttDel(i){TS(TT().filter(y=>y.id!=i));ttView()}
let ac,ring;const ctx=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}};
function beep(){ctx();let n=0;ring=setInterval(()=>{try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=n++%2?880:660;o.connect(g);g.connect(ac.destination);g.gain.value=.3;o.start();o.stop(ac.currentTime+.25)}catch{}},400)}
function stopRing(){clearInterval(ring);$('#al')?.remove()}
function fire(x){navigator.vibrate?.([300,150,300,150,300]);try{Notification.permission=='granted'&&new Notification('⏰ '+x.s,{body:'Time for '+x.s})}catch{}
 const d=document.createElement('div');d.id='al';d.style='position:fixed;inset:0;z-index:99;background:#000d;display:grid;place-items:center';d.innerHTML=`<div class=card style="text-align:center;width:min(90%,340px)"><div style="font-size:54px">⏰</div><h2>${esc(x.s)}</h2><p>It's time for class!</p><button class=p onclick=stopRing()>Stop alarm</button></div>`;document.body.appendChild(d);beep();setTimeout(stopRing,6e4)}
setInterval(()=>{const n=new Date(),k=n.toDateString(),a=TT();a.forEach(x=>{if(x.a&&x.d==n.getDay()&&x.h==n.getHours()&&x.m==n.getMinutes()&&x.f!=k){x.f=k;TS(a);fire(x)}})},10000);
document.addEventListener('click',ctx,{once:true});
const info=t=>{if(!t)return'';const l=String(t).split('\n').filter(x=>x.trim()),tb=l.filter(x=>x.includes('|')).length>=2;return`<div class=info><b>Refer to the following information.</b>${tb?'<table>'+l.map((x,i)=>'<tr>'+x.split('|').map(c=>`<${i?'td':'th'}>${esc(c.trim())}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>':l.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`};
const paper=p=>`<div class=paper><div class=ph><span>S3 · ${esc(p.subject)}</span><span>${p.type=='quiz'?'Quiz':'Question'}</span></div><p class=qn>Question ${p.no||''}${p.marks?`<span class=mk>[${p.marks}]</span>`:''}</p>${info(p.info)}<p class=tx>${esc(p.text)}</p>${'<div class=ln></div>'.repeat(Math.min(p.marks||2,4))}<div id="a${p.id}"></div></div>`;
let jp;async function jpoll(){clearInterval(jp);const tick=async()=>{const j=await api('/api/job'),c=$('#jc');if(!c){clearInterval(jp);return}if(j.error)return;c.style.display=j.total?'block':'none';$('#jl').textContent=(j.running?'⏳ ':'✅ ')+j.label+': '+j.done+' of '+j.total;$('#jf').style.width=(j.total?j.done/j.total*100:0)+'%';$('#jt').textContent=(j.running?'Now making: '+j.cur+' · ':'')+j.made+' made · '+(j.total-j.done)+' remaining'+(j.errors.length?' · ⚠️ '+j.errors.slice(-2).join('; '):'');if(!j.running)clearInterval(jp)};await tick();jp=setInterval(tick,1500)}
theme(localStorage.th||'light');nav();render();
</script></body></html>
